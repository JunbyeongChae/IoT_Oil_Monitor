; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- 라이브러리 의존성 추가 ---
lib_deps = 
    NewPing
    witnessmenow/UniversalTelegramBot  ; 텔레그램 봇
    bblanchon/ArduinoJson              ; JSON 처리용

; --- 안정성 확보 (원격 설정 오류 방지) ---
board_build.arduino.upstream_packages = no

; --- 파티션: OTA에는 앱 슬롯 2개가 필요 (huge_app.csv는 1개뿐이라 OTA 불가) ---
board_build.partitions = min_spiffs.csv

; 기본 환경은 유선 업로드 (최초 플래시/복구용). 무선은 [env:ota] 사용.

[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = Oil_Level_Sensor.local  ; setupOTA()의 setHostname과 일치, 고정 IP 대신 mDNS
; pio run -e ota -t upload